name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Django System Checks
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-test-secret-key-taskflow-django-super-secret"
          DB_NAME: "taskflow_test"
          DB_USER: "taskflow"
          DB_PASSWORD: "taskflow_test_password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: uv run python manage.py check

      - name: Run Pytest Suite
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-test-secret-key-taskflow-django-super-secret"
          DB_NAME: "taskflow_test"
          DB_USER: "taskflow"
          DB_PASSWORD: "taskflow_test_password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: uv run pytest --maxfail=1

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run Type Check & Build
        run: npm run build
